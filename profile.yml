who_i_am: "I'm Meek Dieu Merci NUKURI, a Computer Science student drawn to the point where software engineering, data, and applied AI meet. I study algorithms, data structures, and system design, then use personal projects to turn that theory into working products. I care about understanding how the pieces fit together: what a person needs, how an interface communicates it, and what the services behind it must do reliably."
what_i_do: "I build full-stack applications and backend services with TypeScript, JavaScript, and Python. My projects use tools such as Next.js, NestJS, FastAPI, PostgreSQL, and Docker. I have explored logistics workflows through shipment tracking, fleet, warehouse, and dispatch features; financial planning through risk evaluation and portfolio analytics; and productivity through a daily routine tracker. I also build practical AI projects and keep developing my experience with machine-learning systems."
vision: "I want to create dependable, intelligent software that makes complicated tasks easier and earns the trust of the people who use it. That means paying attention to clear product behavior, careful data handling, resilient services, and architecture that can grow without becoming difficult to change. I am especially interested in applied machine learning, deep learning, LLM workflows, and the engineering needed to take those ideas into useful products."
beyond_code: "Good engineering starts with curiosity: asking who a feature helps, what assumptions a system makes, and how it may fail in the real world. I enjoy learning across software, AI, and infrastructure, then sharing what I learn through projects and open-source work. I value clear communication, steady practice, and thoughtful problem solving as much as the code itself."
tagline_footer: "Building thoughtful software, one project and one lesson at a time."
