<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420">
  <defs>
    <!-- Pulse animation for markers -->
    <filter id="glow-w">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Tooltip box shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Animated pulse keyframes via SMIL -->
    <style>
      .label { font-family: 'Courier New', Courier, monospace; }
      .hub-dot { cursor: pointer; }
    </style>
  </defs>

  <!-- ── Background ── -->
  <rect width="860" height="420" fill="#0a0a0a" rx="10"/>

  <!-- ── Top header bar ── -->
  <rect width="860" height="36" fill="#111111" rx="10"/>
  <rect y="26" width="860" height="10" fill="#111111"/>
  <rect x="14" y="11" width="10" height="10" rx="5" fill="#2a2a2a"/>
  <rect x="32" y="11" width="10" height="10" rx="5" fill="#2a2a2a"/>
  <rect x="50" y="11" width="10" height="10" rx="5" fill="#2a2a2a"/>
  <text x="430" y="22" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#666666" letter-spacing="3">KIGALI · RWANDA · TECH ECOSYSTEM</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--   AFRICA CONTINENT (left panel, compact)                  -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g transform="translate(18, 44)">

    <!-- Continent outline – simplified but recognizable Africa shape -->
    <path d="
      M108,6  L128,4  L148,8  L162,4  L174,8  L182,18
      L185,32 L180,46 L188,60 L196,76 L198,92 L196,108
      L202,124 L204,144 L202,162 L206,180 L204,196
      L210,214 L208,230 L200,248 L190,264 L176,278
      L160,290 L142,300 L124,308 L108,312 L94,308
      L80,298  L66,284  L54,268  L44,250  L38,232
      L34,214  L32,196  L30,178  L34,160  L32,142
      L34,124  L40,108  L42,88   L38,70   L44,54
      L54,40   L66,28   L82,16   Z
    " fill="#161616" stroke="#3a3a3a" stroke-width="1.2"/>

    <!-- Madagascar -->
    <ellipse cx="222" cy="200" rx="10" ry="26" fill="#161616" stroke="#3a3a3a" stroke-width="1" transform="rotate(-10,222,200)"/>

    <!-- Equator dashed line -->
    <line x1="30" y1="195" x2="212" y2="195" stroke="#2a2a2a" stroke-width="0.7" stroke-dasharray="4,3"/>
    <text x="32" y="192" font-family="'Courier New', monospace" font-size="6" fill="#333333">EQ</text>

    <!-- ── Rwanda marker (centre-east Africa) ── -->
    <!-- Rwanda is roughly at: x≈168, y≈195 in this coord space -->
    <g transform="translate(168, 194)">

      <!-- Outer pulse rings -->
      <circle r="4" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0">
        <animate attributeName="r"       values="6;20;6"     dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7"  dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0">
        <animate attributeName="r"       values="4;13;4"     dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5"  dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Core dot -->
      <circle r="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" filter="url(#glow-w)">
        <animate attributeName="r" values="3.5;5;3.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Rwanda label -->
    <text x="172" y="188" font-family="'Courier New', monospace" font-size="7.5" fill="#ffffff" font-weight="bold" letter-spacing="0.5">RW</text>

    <!-- Other continent reference dots (very subtle) -->
    <!-- Cairo -->
    <circle cx="148" cy="28" r="1.5" fill="#444444"/>
    <text x="152" y="30" font-family="'Courier New', monospace" font-size="5.5" fill="#444444">Cairo</text>
    <!-- Lagos -->
    <circle cx="84" cy="168" r="1.5" fill="#444444"/>
    <text x="88" y="170" font-family="'Courier New', monospace" font-size="5.5" fill="#444444">Lagos</text>
    <!-- Nairobi -->
    <circle cx="176" cy="212" r="1.5" fill="#444444"/>
    <text x="180" y="214" font-family="'Courier New', monospace" font-size="5.5" fill="#444444">Nairobi</text>
    <!-- Cape Town -->
    <circle cx="110" cy="300" r="1.5" fill="#444444"/>
    <text x="88" y="308" font-family="'Courier New', monospace" font-size="5.5" fill="#444444">Cape Town</text>
    <!-- Addis Ababa -->
    <circle cx="182" cy="160" r="1.5" fill="#444444"/>
    <!-- Dakar -->
    <circle cx="38" cy="126" r="1.5" fill="#444444"/>
    <text x="42" y="128" font-family="'Courier New', monospace" font-size="5.5" fill="#444444">Dakar</text>

    <!-- Connector line from Rwanda dot to detail panel -->
    <line x1="172" y1="194" x2="248" y2="160" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>
    <circle cx="248" cy="160" r="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!--   KIGALI TECH HUB PANEL (right section)                   -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Panel background -->
  <rect x="276" y="48" width="566" height="358" fill="#0d0d0d" rx="6" stroke="#222222" stroke-width="1"/>

  <!-- Panel title -->
  <text x="559" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" letter-spacing="4" font-weight="bold">KIGALI TECH ECOSYSTEM</text>
  <line x1="296" y1="80" x2="822" y2="80" stroke="#222222" stroke-width="0.8"/>

  <!-- Coordinates badge -->
  <rect x="700" y="58" width="110" height="16" fill="#111111" rx="3" stroke="#333333" stroke-width="0.7"/>
  <text x="755" y="69" text-anchor="middle" font-family="'Courier New', monospace" font-size="7.5" fill="#555555">1.9441°S  30.0619°E</text>

  <!-- ── Hub cards ── -->
  <!-- Each card: icon area + title + description + tag -->

  <!-- CARD 1 — Norrsken House Kigali -->
  <g transform="translate(296, 96)">
    <rect width="254" height="130" fill="#111111" rx="6" stroke="#2a2a2a" stroke-width="1"/>
    <!-- accent bar -->
    <rect width="3" height="130" fill="#ffffff" rx="2"/>
    <!-- icon placeholder -->
    <text x="24" y="30" font-family="'Courier New', monospace" font-size="22" fill="#ffffff">⬡</text>
    <!-- title -->
    <text x="52" y="24" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold">Norrsken House Kigali</text>
    <text x="52" y="36" font-family="'Courier New', monospace" font-size="8" fill="#555555" letter-spacing="2">INNOVATION HUB</text>
    <!-- divider -->
    <line x1="14" y1="46" x2="240" y2="46" stroke="#1e1e1e" stroke-width="0.8"/>
    <!-- description -->
    <text x="14" y="62" font-family="'Courier New', monospace" font-size="8.5" fill="#aaaaaa">Pan-African impact tech hub powering</text>
    <text x="14" y="74" font-family="'Courier New', monospace" font-size="8.5" fill="#aaaaaa">startups tackling Africa's biggest</text>
    <text x="14" y="86" font-family="'Courier New', monospace" font-size="8.5" fill="#aaaaaa">challenges across 10+ countries.</text>
    <!-- tags -->
    <rect x="14" y="98" width="62" height="14" fill="#1a1a1a" rx="3" stroke="#333333" stroke-width="0.7"/>
    <text x="45" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888888">COWORKING</text>
    <rect x="82" y="98" width="60" height="14" fill="#1a1a1a" rx="3" stroke="#333333" stroke-width="0.7"/>
    <text x="112" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888888">STARTUPS</text>
    <rect x="148" y="98" width="56" height="14" fill="#1a1a1a" rx="3" stroke="#333333" stroke-width="0.7"/>
    <text x="176" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888888">NETWORK</text>
    <!-- location -->
    <text x="14" y="122" font-family="'Courier New', monospace" font-size="7.5" fill="#444444">▸ KG 7 Ave, Kigali</text>
    <!-- pulse dot -->
    <circle cx="238" cy="14" r="4" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CARD 2 — Digital Transformation Center -->
  <g transform="translate(558, 96)">
    <rect width="254" height="130" fill="#111111" rx="6" stroke="#2a2a2a" stroke-width="1"/>
    <rect width="3" height="130" fill="#dddddd" rx="2"/>
    <text x="24" y="30" font-family="'Courier New', monospace" font-size="22" fill="#ffffff">◈</text>
    <text x="52" y="24" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold">Digital Transform. Center</text>
    <text x="52" y="36" font-family="'Courier New', monospace" font-size="8" fill="#555555" letter-spacing="2">GOVERNMENT · TECH</text>
    <line x1="14" y1="46" x2="240" y2="46" stroke="#1e1e1e" stroke-width="0.8"/>
    <text x="14" y="62" font-family="'Courier New', monospace" font-size="8.5" fill="#aaaaaa">Rwanda's flagship digital economy</text>
    <text x="14" y="74" font-family="'Courier New', monospace" font-size="8.5" fill="#aaaaaa">hub driving e-gov, ICT education,</text>
    <text x="14" y="86" font-family="'Courier New', monospace" font-size="8.5" fill="#aaaaaa">and private sector acceleration.</text>
    <rect x="14" y="98" width="50" height="14" fill="#1a1a1a" rx="3" stroke="#333333" stroke-width="0.7"/>
    <text x="39" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888888">E-GOV</text>
    <rect x="70" y="98" width="48" height="14" fill="#1a1a1a" rx="3" stroke="#333333" stroke-width="0.7"/>
    <text x="94" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888888">TRAINING</text>
    <rect x="124" y="98" width="56" height="14" fill="#1a1a1a" rx="3" stroke="#333333" stroke-width="0.7"/>
    <text x="152" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#888888">RESEARCH</text>
    <text x="14" y="122" font-family="'Courier New', monospace" font-size="7.5" fill="#444444">▸ Kacyiru, Kigali</text>
    <circle cx="238" cy="14" r="4" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CARD 3 — kLab -->
  <g transform="translate(296, 238)">
    <rect width="160" height="110" fill="#111111" rx="6" stroke="#2a2a2a" stroke-width="1"/>
    <rect width="3" height="110" fill="#aaaaaa" rx="2"/>
    <text x="24" y="28" font-family="'Courier New', monospace" font-size="20" fill="#ffffff">⬛</text>
    <text x="52" y="22" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold">kLab</text>
    <text x="52" y="33" font-family="'Courier New', monospace" font-size="7.5" fill="#555555" letter-spacing="1.5">KNOWLEDGE LAB</text>
    <line x1="14" y1="42" x2="146" y2="42" stroke="#1e1e1e" stroke-width="0.8"/>
    <text x="14" y="56" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">Open tech innovation</text>
    <text x="14" y="67" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">space for developers,</text>
    <text x="14" y="78" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">designers &amp; builders.</text>
    <text x="14" y="100" font-family="'Courier New', monospace" font-size="7" fill="#444444">▸ Remera, Kigali</text>
  </g>

  <!-- CARD 4 — CMU Africa -->
  <g transform="translate(466, 238)">
    <rect width="164" height="110" fill="#111111" rx="6" stroke="#2a2a2a" stroke-width="1"/>
    <rect width="3" height="110" fill="#888888" rx="2"/>
    <text x="24" y="28" font-family="'Courier New', monospace" font-size="20" fill="#ffffff">◉</text>
    <text x="52" y="22" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold">CMU Africa</text>
    <text x="52" y="33" font-family="'Courier New', monospace" font-size="7.5" fill="#555555" letter-spacing="1.5">RESEARCH · ACADEMIA</text>
    <line x1="14" y1="42" x2="150" y2="42" stroke="#1e1e1e" stroke-width="0.8"/>
    <text x="14" y="56" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">Carnegie Mellon Africa</text>
    <text x="14" y="67" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">graduate engineering &amp;</text>
    <text x="14" y="78" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">AI research campus.</text>
    <text x="14" y="100" font-family="'Courier New', monospace" font-size="7" fill="#444444">▸ Kigali Heights, KG 7</text>
  </g>

  <!-- CARD 5 — Impact Hub Kigali -->
  <g transform="translate(640, 238)">
    <rect width="178" height="110" fill="#111111" rx="6" stroke="#2a2a2a" stroke-width="1"/>
    <rect width="3" height="110" fill="#666666" rx="2"/>
    <text x="24" y="28" font-family="'Courier New', monospace" font-size="20" fill="#ffffff">◎</text>
    <text x="52" y="22" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="bold">Impact Hub</text>
    <text x="52" y="33" font-family="'Courier New', monospace" font-size="7.5" fill="#555555" letter-spacing="1.5">COMMUNITY · WORK</text>
    <line x1="14" y1="42" x2="164" y2="42" stroke="#1e1e1e" stroke-width="0.8"/>
    <text x="14" y="56" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">Global network coworking</text>
    <text x="14" y="67" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">hub for social impact</text>
    <text x="14" y="78" font-family="'Courier New', monospace" font-size="7.5" fill="#aaaaaa">entrepreneurs &amp; makers.</text>
    <text x="14" y="100" font-family="'Courier New', monospace" font-size="7" fill="#444444">▸ Kimihurura, Kigali</text>
  </g>

  <!-- ── bottom status bar ── -->
  <rect x="276" y="360" width="566" height="46" fill="#0d0d0d" rx="0"/>
  <rect x="276" y="360" width="566" height="1" fill="#222222"/>
  <rect x="276" y="395" width="566" height="11" fill="#0d0d0d" rx="6"/>

  <!-- Status dots -->
  <circle cx="298" cy="382" r="3.5" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="308" y="386" font-family="'Courier New', monospace" font-size="8" fill="#555555">5 ACTIVE HUBS</text>

  <circle cx="430" cy="382" r="3.5" fill="#aaaaaa" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <text x="440" y="386" font-family="'Courier New', monospace" font-size="8" fill="#555555">KIGALI, RWANDA</text>

  <text x="818" y="386" text-anchor="end" font-family="'Courier New', monospace" font-size="8" fill="#333333" letter-spacing="1">MERCIA-lab · 2026</text>

  <!-- Corner brackets (aesthetic frame) -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <polyline points="6,44 6,58 20,58"/>
    <polyline points="854,44 854,58 840,58"/>
    <polyline points="6,406 6,392 20,392"/>
    <polyline points="854,406 854,392 840,392"/>
  </g>
</svg>
