<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="500" height="580">
  <defs>
    <!-- Scanline / noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>

    <!-- Glow for Rwanda marker -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulse animation for Rwanda dot -->
    <radialGradient id="pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip for continent -->
    <clipPath id="africa-clip">
      <path d="M200,22 L240,18 L275,25 L295,15 L315,22 L330,38 L335,60 L325,80
               L340,100 L355,130 L360,160 L355,190 L365,220 L370,255 L365,285
               L375,315 L372,345 L360,375 L345,400 L325,425 L300,450 L275,470
               L250,488 L228,498 L210,488 L195,470 L175,450 L158,425 L142,395
               L130,365 L125,335 L118,305 L115,275 L120,245 L118,215 L122,185
               L115,160 L118,135 L128,110 L132,85 L128,62 L140,45 L160,32 L180,24 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="580" fill="#000000"/>

  <!-- Stars background -->
  <g opacity="0.4">
    <circle cx="30" cy="40" r="1" fill="#ffffff"/>
    <circle cx="80" cy="15" r="1.5" fill="#ffffff"/>
    <circle cx="140" cy="55" r="1" fill="#ffffff"/>
    <circle cx="420" cy="30" r="1" fill="#ffffff"/>
    <circle cx="460" cy="60" r="1.5" fill="#ffffff"/>
    <circle cx="470" cy="20" r="1" fill="#ffffff"/>
    <circle cx="50" cy="120" r="1" fill="#ffffff"/>
    <circle cx="30" cy="200" r="1.2" fill="#ffffff"/>
    <circle cx="480" cy="180" r="1" fill="#ffffff"/>
    <circle cx="490" cy="350" r="1.5" fill="#ffffff"/>
    <circle cx="20" cy="400" r="1" fill="#ffffff"/>
    <circle cx="60" cy="480" r="1.2" fill="#ffffff"/>
    <circle cx="440" cy="480" r="1" fill="#ffffff"/>
    <circle cx="470" cy="530" r="1.5" fill="#ffffff"/>
    <circle cx="100" cy="555" r="1" fill="#ffffff"/>
  </g>

  <!-- Title -->
  <text x="250" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" letter-spacing="4" font-weight="bold">▸ KIGALI, RWANDA</text>
  <text x="250" y="520" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#888888" letter-spacing="2">1.9441° S, 30.0619° E</text>

  <!-- Africa continent shape -->
  <g transform="translate(55, 20) scale(1.55, 1.55)">

    <!-- Continent fill -->
    <path d="M200,22 L240,18 L275,25 L295,15 L315,22 L330,38 L335,60 L325,80
             L340,100 L355,130 L360,160 L355,190 L365,220 L370,255 L365,285
             L375,315 L372,345 L360,375 L345,400 L325,425 L300,450 L275,470
             L250,488 L228,498 L210,488 L195,470 L175,450 L158,425 L142,395
             L130,365 L125,335 L118,305 L115,275 L120,245 L118,215 L122,185
             L115,160 L118,135 L128,110 L132,85 L128,62 L140,45 L160,32 L180,24 Z"
          fill="#111111" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>

    <!-- Madagascar island -->
    <ellipse cx="385" cy="280" rx="18" ry="45" fill="#111111" stroke="#ffffff" stroke-width="1" transform="rotate(-15, 385, 280)"/>

    <!-- Country grid lines (latitude/longitude feel) -->
    <g stroke="#222222" stroke-width="0.5" opacity="0.6" clip-path="url(#africa-clip)">
      <line x1="120" y1="100" x2="370" y2="100"/>
      <line x1="120" y1="150" x2="375" y2="150"/>
      <line x1="115" y1="200" x2="370" y2="200"/>
      <line x1="115" y1="250" x2="375" y2="250"/>
      <line x1="115" y1="300" x2="375" y2="300"/>
      <line x1="118" y1="350" x2="370" y2="350"/>
      <line x1="125" y1="400" x2="355" y2="400"/>
      <line x1="145" y1="450" x2="320" y2="450"/>

      <line x1="155" y1="22" x2="155" y2="490"/>
      <line x1="195" y1="18" x2="195" y2="490"/>
      <line x1="235" y1="18" x2="235" y2="495"/>
      <line x1="275" y1="20" x2="275" y2="472"/>
      <line x1="315" y1="22" x2="315" y2="440"/>
      <line x1="350" y1="38" x2="350" y2="380"/>
    </g>

    <!-- Rwanda marker - approx position on scaled map -->
    <!-- Rwanda is roughly at center-east of Africa -->
    <g transform="translate(290, 278)">
      <!-- Outer pulse rings -->
      <circle r="28" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0">
        <animate attributeName="r" values="12;32;12" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="20" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0">
        <animate attributeName="r" values="8;22;8" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <!-- Core dot -->
      <circle r="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#glow)">
        <animate attributeName="r" values="4;6;4" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Rwanda label -->
    <g transform="translate(300, 265)">
      <rect x="-2" y="-12" width="60" height="14" fill="#000000" fill-opacity="0.75" rx="2"/>
      <text font-family="'Courier New', monospace" font-size="9" fill="#ffffff" font-weight="bold" letter-spacing="1">RWANDA</text>
    </g>

    <!-- Connection line from dot to label -->
    <line x1="295" y1="270" x2="302" y2="265" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2,2"/>

    <!-- Other major city dots (subtle) -->
    <!-- Cairo -->
    <circle cx="265" cy="52" r="2" fill="#555555"/>
    <text x="270" y="50" font-family="'Courier New', monospace" font-size="6" fill="#555555">CAIRO</text>
    <!-- Lagos -->
    <circle cx="178" cy="270" r="2" fill="#555555"/>
    <text x="183" y="268" font-family="'Courier New', monospace" font-size="6" fill="#555555">LAGOS</text>
    <!-- Nairobi -->
    <circle cx="305" cy="295" r="2" fill="#555555"/>
    <text x="310" y="293" font-family="'Courier New', monospace" font-size="6" fill="#555555">NAIROBI</text>
    <!-- Cape Town -->
    <circle cx="210" cy="472" r="2" fill="#555555"/>
    <text x="185" y="480" font-family="'Courier New', monospace" font-size="6" fill="#555555">CAPE TOWN</text>
    <!-- Johannesburg -->
    <circle cx="245" cy="432" r="2" fill="#555555"/>
    <text x="250" y="430" font-family="'Courier New', monospace" font-size="6" fill="#555555">J'BURG</text>
    <!-- Addis Ababa -->
    <circle cx="308" cy="235" r="2" fill="#555555"/>
    <text x="312" y="233" font-family="'Courier New', monospace" font-size="6" fill="#555555">ADDIS</text>
    <!-- Dakar -->
    <circle cx="128" cy="210" r="2" fill="#555555"/>
    <text x="132" y="208" font-family="'Courier New', monospace" font-size="6" fill="#555555">DAKAR</text>

    <!-- Equator line -->
    <line x1="118" y1="320" x2="375" y2="320" stroke="#333333" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="122" y="316" font-family="'Courier New', monospace" font-size="6" fill="#444444">EQUATOR</text>

    <!-- Tropic of Cancer line -->
    <line x1="155" y1="118" x2="340" y2="118" stroke="#2a2a2a" stroke-width="0.6" stroke-dasharray="3,4"/>
    <text x="158" y="114" font-family="'Courier New', monospace" font-size="5" fill="#333333">TROPIC OF CANCER</text>

    <!-- Tropic of Capricorn line -->
    <line x1="132" y1="418" x2="360" y2="418" stroke="#2a2a2a" stroke-width="0.6" stroke-dasharray="3,4"/>
    <text x="135" y="414" font-family="'Courier New', monospace" font-size="5" fill="#333333">TROPIC OF CAPRICORN</text>

  </g>

  <!-- Scanning line animation overlay -->
  <rect width="500" height="4" fill="url(#pulse-grad)" opacity="0.08">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,576;0,0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom bar -->
  <rect x="0" y="545" width="500" height="35" fill="#0a0a0a"/>
  <line x1="0" y1="545" x2="500" y2="545" stroke="#333333" stroke-width="0.8"/>
  <text x="250" y="560" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#444444" letter-spacing="3">MERCIA-lab · BUILDING FROM AFRICA</text>
  <text x="250" y="573" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#2a2a2a" letter-spacing="2">github.com/MERCIA-lab</text>

  <!-- Corner brackets (aesthetic) -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="10,10 10,30 30,30"/>
    <polyline points="490,10 490,30 470,30"/>
    <polyline points="10,570 10,550 30,550"/>
    <polyline points="490,570 490,550 470,550"/>
  </g>
</svg>
