name: Update generated profile

on:
  push:
    paths:
      - profile.yml
      - templates/**
      - scripts/**
  schedule:
    - cron: "17 6 * * *"
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install --upgrade jinja2 pyyaml requests

      - name: Generate SVG assets and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Commit generated profile when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/pixel-banner.svg assets/pixel-banner-light.svg assets/pixel-divider.svg assets/project-showcase.svg assets/generated assets/icons
          if git diff --cached --quiet; then
            echo "Generated profile is already up to date."
          else
            git commit -m "chore: update profile [skip ci]"
            git push
          fi
