name: Update profile analytics

on:
  push:
    paths-ignore:
      - "assets/**"
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, synchronize, closed, reopened]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate profile assets
        run: python scripts/generate_profile_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit refreshed assets
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- assets; then
            echo "Profile assets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: refresh profile analytics"
          git push
